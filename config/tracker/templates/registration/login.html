
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login | RepairProof</title>
    <link rel="stylesheet" href="{% static 'tracker/style.css' %}">
</head>
<body class="auth-page">

<div class="auth-card">
    <h1>Repair<span>Proof</span></h1>
    <p class="subtitle">Welcome back! Sign in to your account.</p>

    {% if form.errors %}
        <p class="auth-error">Invalid username or password.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Username</label>
            {{ form.username }}
        </div>

        <div class="form-group">
            <label>Password</label>
            {{ form.password }}
        </div>

        <button class="primary-btn auth-submit" type="submit">
            Login →
        </button>
    </form>

    <p class="auth-footer">
        Don't have an account?
        <a href="{% url 'register' %}">Create account</a>
    </p>
</div>

</body>
</html>
